<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="container">
        <h1>Expense Tracker</h1>

        <section  class="total-expense">
            <h2>Total Expense</h2>
            <h2 class="total-amount">₹0</h2>
        </section>

        <section class="expense-form">
            <input type="text" class="expense-name" placeholder="Expense name...">
            <input type="number" class="expense-amount" placeholder="Expense amount..." min="1">

            <select class="expense-category">
                <option value="">Select Category</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Other">Other</option>
            </select>

            <button class="add-expense-btn">Add Expense</button>
        </section>

        <section class="expense-list-section">
            <select class="dropdown">
                <option value="All Categories">All Categories</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Other">Other</option>
            </select>
            <h2>Expense History</h2>
            <div class="expense-list"></div>
        </section>
    </main>
    <script src="./script.js"></script>
</body>
</html>
