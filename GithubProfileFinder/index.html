<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="main">
      <h2>
        <span><i class="fa-brands fa-github"></i></span> Github
        <span class="finder">Profile Finder</span>
      </h2>
      <p class="search-github">
        Search for GitHub users and explore their profiles! start by entering a
        username below.
      </p>
    </div>

    <div class="search">
      <input type="text" class="input" placeholder="Enter GitHub username" />
      <button class="searchBtn">Search</button>
    </div>

    <div class="profile-card">
      <img src="" alt="" class="img" />

      <div class="profile-info">
        <div class="profile-name-bio">
          <div class="name">The Octocat</div>
          <div class="userid">@octocat</div>
          <div class="bio">Github official mascot.</div>
        </div>

        <div class="location-link">
          <div class="location"> <i class="fa-solid fa-location-dot"></i> San Francico</div>
          <div class="link"><i class="fa-solid fa-link"></i> github.com</div>
          <div class="joinedate"><i class="fa-regular fa-calendar"></i> 10-11-12</div>
          <button class="btn-btn">View On Github</button>
        </div>

        <div class="folllowers-follow">
          <div class="repo">
            <p class="repos">8</p>
            <p>Repo</p>
          </div>

          <div class="followers">
            <p class="foll">8.1K</p>
            <p>Followers</p>
          </div>

          <div class="followwing">
            <p class="follo">8</p>
            <p>Following</p>
          </div>
        </div>
      </div>
    </div>

    <div class="statistics"></div>

    <div class="repositories"></div>

    <script src="script.js"></script>
  </body>
</html>
